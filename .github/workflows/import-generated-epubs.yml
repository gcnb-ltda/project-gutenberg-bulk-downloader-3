name: Import Project Gutenberg generated EPUBs - Part 3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gutenberg-epub-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Import next EPUB batch
        env:
          RUN_TARGET_MIB: '2800'
          REPO_TARGET_GIB: '8'
          MAX_FILE_MIB: '90'
          PUSH_BATCH_MIB: '450'
        run: |
          chmod +x import_generated_epubs.sh
          ./import_generated_epubs.sh

      - name: Show checkpoint
        if: always()
        run: |
          test -f epub-continuation-state.json && cat epub-continuation-state.json || true
